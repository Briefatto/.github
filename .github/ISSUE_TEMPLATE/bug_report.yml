name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the file you used, in order.
      placeholder: |
        1. npx briefatto-board install
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages or command output. Images help for anything visual.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: From your lockfile, or "latest" if you ran it with npx.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version and the agent that ran it.
