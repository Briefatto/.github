name: Feature request
description: An idea, a missing piece or a new brand for the gallery.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: For a new brand, its public site.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
